[project]
name = "png2dxf"
version = "0.1.0"
description = "Research code for PNG-to-DXF conversion and shear wall analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4.16",
    "ezdxf==1.4.2",
    "matplotlib>=3.5.0",
    "networkx>=3.6.1",
    "numpy==1.26.4",
    "opencv-python>=4.5.0",
    "openseespy>=3.8.0.0",
    "pandas>=1.3.0",
    "pillow>=8.0.0",
    "scikit-learn>=1.0.0",
    "seaborn>=0.11.0",
    "shapely>=1.7.0",
    "torch==2.5.1+cu124",
    "torch-geometric>=2.7.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
