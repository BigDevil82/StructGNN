[project]
name = "png2dxf"
version = "0.1.0"
description = "Research code for PNG-to-DXF conversion and shear wall analysis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "comtypes>=1.4.16",
    "ezdxf==1.4.2",
    "fastparquet>=2026.3.0",
    "matplotlib>=3.5.0",
    "networkx>=3.6.1",
    "numpy==1.26.4",
    "opencv-python>=4.5.0",
    "openseespy>=3.8.0.0",
    "pandas>=1.3.0",
    "parquet>=1.3.1",
    "pillow>=8.0.0",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.0.0",
    "seaborn>=0.11.0",
    "shapely>=1.7.0",
    "snakeviz>=2.2.2",
    "torch==2.5.1+cu124; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.11.0+cu126; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "torch-geometric>=2.7.0",
    "optuna>=4.8.0",
]

[tool.uv]
package = false
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
