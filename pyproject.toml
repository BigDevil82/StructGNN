[project]
name = "png2dxf"
version = "0.1.0"
description = "Research code for PNG-to-DXF conversion and shear wall analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4.16",
    "ezdxf>=0.17.0",
    "matplotlib>=3.5.0",
    "networkx>=3.6.1",
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "openseespy>=3.8.0.0",
    "pandas>=1.3.0",
    "pillow>=8.0.0",
    "scikit-learn>=1.0.0",
    "seaborn>=0.11.0",
    "shapely>=1.7.0",
    "torch==2.10.0",
    "torch-geometric>=2.7.0",
    "tqdm>=4.67.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
